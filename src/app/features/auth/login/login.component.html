<div
  class="min-vh-100 d-flex align-items-center justify-content-center bg-light"
>
  <div class="container">
    <div class="row justify-content-around g-4">
      <!-- LOGIN CARD -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow h-100">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div
                class="bg-primary text-white rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center"
                style="width: 64px; height: 64px"
              >
                <i class="fas fa-shield-alt fa-2x"></i>
              </div>
              <h2 class="fw-bold text-primary">Compliance Portal</h2>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  formControlName="email"
                  [class.is-invalid]="
                    loginForm.get('email')?.invalid &&
                    loginForm.get('email')?.touched
                  "
                />
                <div
                  class="invalid-feedback"
                  *ngIf="
                    loginForm.get('email')?.invalid &&
                    loginForm.get('email')?.touched
                  "
                >
                  Please enter a valid email address
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  formControlName="password"
                  [class.is-invalid]="
                    loginForm.get('password')?.invalid &&
                    loginForm.get('password')?.touched
                  "
                />
                <div
                  class="invalid-feedback"
                  *ngIf="
                    loginForm.get('password')?.invalid &&
                    loginForm.get('password')?.touched
                  "
                >
                  Password is required
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mb-4"
                [disabled]="loginForm.invalid || isLoading"
              >
                <span
                  *ngIf="isLoading"
                  class="spinner-border spinner-border-sm me-2"
                ></span>
                Sign In
              </button>

              <div class="text-center">
                <div class="bg-light p-3 rounded">
                  <small class="text-muted d-block mb-2"
                    ><strong>Demo Credentials:</strong></small
                  >
                  <small class="text-muted d-block"
                    >Compliance: compliance&#64;compliance.com</small
                  >
                  <small class="text-muted d-block mt-2"
                    ><strong>Password:</strong> password</small
                  >
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- INSTRUCTIONS PANEL COLUMN -->
      <div class="col-md-6 col-lg-5">
        <app-instructions-panel></app-instructions-panel>
      </div>
    </div>
  </div>
</div>
