version: '3.8'

volumes:
  node_modules_data:

services:
  regulatory-compliance-portal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm ci && npm start"
    stdin_open: true
    tty: true

  # Optional: Add a simple backend service for future API integration
  api-server:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm start"
    depends_on:
      - regulatory-compliance-portal